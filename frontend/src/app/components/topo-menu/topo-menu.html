<div class="row pb-3">
    <div class="col-6">
        <h1 class="text-start mb-4">{{ menu.titulo }}</h1>
    </div>
    <div class="col-6 d-flex justify-content-end gap-2 mt-3">
        @if(menu.btnCadastrar){
            <div class="col-auto">
                <button
                type="button"
                class="btn btn-secondary"
                (click)="cadastrar.emit()">
                Cadastrar
            </button>
        </div>
        }

        @if(menu.btnVoltar){
            <div class="col-auto">
                <button
                type="button"
                class="btn btn-secondary"
                (click)="voltar.emit()">
                Voltar
            </button>
        </div>
        }
        
    </div>
</div>
