<table class="table table-hover">
  <thead>
    <tr scope="col" class="p-3 text-center">
      @for (coluna of colunas; track coluna.campo) {
        <th>
          {{ coluna.titulo }}
        </th>
      }
    </tr>
  </thead>

  <tbody>
    @for (item of dados; track $index) {
      <tr (click)="detalhe.emit(item)" class="hover">

        @for (coluna of colunas; track coluna.campo) {
          <td [class]="coluna.classe">

            @if (coluna.acao != 'excluir') {
              {{ formatarValor(item, coluna) }}
            }
            @else {
              <button
                type="button"
                (click)="excluir.emit(item); $event.stopPropagation()"
                title="Excluir"
                class="btn btn-sm">
                  <i class="fa-regular fa-trash-can"></i>
              </button>
            }

          </td>
        }

      </tr>
    }
  </tbody>
</table>
