services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: devtools-frontend

    ports:
      - "4200:4200"

    volumes:
      - ./frontend:/app

    environment:
      - CHOKIDAR_USEPOLLING=true

    stdin_open: true
    tty: true

volumes:
  frontend_node_modules: