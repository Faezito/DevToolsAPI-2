services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: devtools-frontend

    ports:
      - "4200:4200"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true
      - FRONTEND_API_KEY=${FRONTEND_API_KEY}

    stdin_open: true
    tty: true

volumes:
  frontend_node_modules: